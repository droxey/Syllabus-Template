<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- UPDATE: Replace every ALL_CAPS placeholder before publishing a course. -->
    <title>COURSE_TITLE</title>
    <meta name="description" content="COURSE_DESCRIPTION">
    <meta name="author" content="COURSE_INSTRUCTOR (INSTRUCTOR_EMAIL)">
    <meta property="og:site_name" content="COURSE_TITLE">
    <meta property="og:title" content="COURSE_TITLE">
    <meta property="og:description" content="COURSE_DESCRIPTION">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="keywords" content="COURSE_KEYWORDS">
    <meta property="og:type" content="website">
    <!-- UPDATE: Replace GITHUB_ORG and REPO_NAME (example: droxey/ACS-3220-Docker-DevOps-Deployments). -->
    <meta property="og:url" content="https://GITHUB_ORG.github.io/REPO_NAME">
    <meta property="og:image" content="https://GITHUB_ORG.github.io/REPO_NAME/Web/logo-icononly.svg">
    <meta property="og:image:secure_url" content="https://GITHUB_ORG.github.io/REPO_NAME/Web/logo-icononly.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="250">
    <meta property="og:image:height" content="250">
    <meta property="og:image:alt" content="COURSE_TITLE">
    <link rel="stylesheet" href="//unpkg.com/docsify-gifcontrol/dist/docsify-gifcontrol.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
      title="docsify-darklight-theme" type="text/css">
    <link rel="stylesheet" href="Web/style.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- UPDATE: name, repo, search.namespace, and logo. -->
    <script>
      window.$docsify = {
        // Leave empty until you add Web/logo-icononly.svg, then set: 'Web/logo-icononly.svg'
        logo: '',
        name: 'COURSE_NAME',
        repo: 'GITHUB_ORG/REPO_NAME',
        themeColor: '#12739e',
        formatUpdated: '{MM}/{DD} {HH}:{mm}',
        executeScript: true,
        auto2top: true,
        autoHeader: true,
        loadSidebar: true,
        loadNavbar: true,
        // Sidebar depth. Do not set maxLevel twice — the second value wins and the first is dead config.
        maxLevel: 3,
        subMaxLevel: 2,
        el: "#app",
        themeable: {
          readyTransition: true,
          responsiveTables: true
        },
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: 'Search class content...',
          noData: 'No Results!',
          depth: 4,
          hideOtherSidebarContent: false,
          namespace: 'REPO_NAME',
        },
        copyCode: {
          buttonText: '📋 Click to Copy',
          errorText: '',
          successText: '✓'
        },
        'flexible-alerts': {
          style: 'flat'
        },
        tabs: {
          persist: true,
          sync: true,
          theme: 'classic',
          tabComments: true,
          tabHeadings: true
        },
        pagination: {
          previousText: 'Previous Module',
          nextText: 'Next Module',
          crossChapter: true,
          crossChapterText: true
        },
        // 600s matches GitHub Pages cache-control for markdown.
        requestHeaders: {
          'cache-control': 'max-age=600'
        },
        gifcontrol: {
          mode: 'hover',
          loadingWidth: '300px',
          loadingHeight: '200px',
          overlayColor: 'rgba(255, 255, 255, 0.7)',
          iconColor: 'rgba(45, 140, 240, 0.8)',
          errorText: "Error loading image",
          errorTextColor: "rgb(150, 150, 150)",
          spinnerBarColor: 'rgb(45, 140, 240)',
          spinnerTrackColor: 'rgba(45, 140, 240, .3)',
        },
        darklightTheme: {
          siteFont: "PT Sans",
          defaultTheme: 'dark',
          codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
          bodyFontSize: '17px',
          dark: {
            accent: '#4BB1E4',
            toogleBackground: '#F5F6F8',
            background: '#091a28',
            textColor: '#b4b4b4',
            codeTextColor: '#ffffff',
            codeBackgroudColor: '#0e2233',
            borderColor: '#0d2538',
            blockQuoteColour: '#858585',
            highlightColor: '#d22778',
            sidebarSublink: '#b4b4b4',
            codeTypeColor: '#ffffff',
            coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
            toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
          },
          light: {
            accent: '#087CB8',
            toogleBackground: '#091a28',
            background: '#F5F6F8',
            textColor: '#34495e',
            codeTextColor: '#525252',
            codeBackgroudColor: '#f8f8f8',
            borderColor: 'rgba(0, 0, 0, 0.07)',
            blockQuoteColor: '#858585',
            highlightColor: '#d22778',
            sidebarSublink: '#0D4062',
            codeTypeColor: '#091a28',
            coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
            toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
          }
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
    <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/rizdaprasetya/docsify-fix-pageload-scroll@master/index.js"></script>
    <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
    <script src="//unpkg.com/docsify/lib/plugins/emoji.min.js"></script>
    <script src="//unpkg.com/docsify/lib/plugins/external-script.min.js"></script>
    <script src="//unpkg.com/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
    <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
    <script src="//unpkg.com/docsify-gifcontrol/dist/docsify-gifcontrol.js"></script>
    <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <!-- Starter Prism languages. Add course-specific packs (docker, nginx, go, …) as needed. -->
    <script src="//unpkg.com/prismjs/components/prism-bash.min.js"></script>
    <script src="//unpkg.com/prismjs/components/prism-javascript.min.js"></script>
    <script src="//unpkg.com/prismjs/components/prism-json.min.js"></script>
    <script src="//unpkg.com/prismjs/components/prism-markdown.min.js"></script>
    <script src="//unpkg.com/prismjs/components/prism-python.min.js"></script>
    <script src="//unpkg.com/prismjs/components/prism-yaml.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
    <script>
      if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('Web/sw.js')
      }
    </script>
  </body>
</html>
