<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- UPDATE: Replace every ALL_CAPS placeholder before publishing a course. -->
    <title>COURSE_TITLE</title>
    <meta name="description" content="COURSE_DESCRIPTION">
    <meta name="author" content="COURSE_INSTRUCTOR (INSTRUCTOR_EMAIL)">
    <meta property="og:site_name" content="COURSE_TITLE">
    <meta property="og:title" content="COURSE_TITLE">
    <meta property="og:description" content="COURSE_DESCRIPTION">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="keywords" content="COURSE_KEYWORDS">
    <meta property="og:type" content="website">
    <!-- UPDATE: Replace GITHUB_ORG and REPO_NAME. -->
    <meta property="og:url" content="https://GITHUB_ORG.github.io/REPO_NAME">
    <meta property="og:image" content="https://GITHUB_ORG.github.io/REPO_NAME/Web/logo-icononly.svg">
    <meta property="og:image:secure_url" content="https://GITHUB_ORG.github.io/REPO_NAME/Web/logo-icononly.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="250">
    <meta property="og:image:height" content="250">
    <meta property="og:image:alt" content="COURSE_TITLE">
    <!-- ACS-3220 stack: vue.css + themeable. Do not load a second theme. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-gifcontrol@0.2.1/dist/docsify-gifcontrol.css">
    <link rel="stylesheet" href="Web/style.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- UPDATE: name, repo, search.namespace, and logo. -->
    <script>
      window.$docsify = {
        // Leave empty until you add Web/logo-icononly.svg, then set: 'Web/logo-icononly.svg'
        logo: '',
        name: 'COURSE_NAME',
        repo: 'GITHUB_ORG/REPO_NAME',
        themeColor: '#126893',
        formatUpdated: '{MM}/{DD} {HH}:{mm}',
        executeScript: true,
        auto2top: true,
        autoHeader: false,
        loadSidebar: true,
        loadNavbar: true,
        // Sidebar depth. Do not set maxLevel twice — the second value wins and the first is dead config.
        maxLevel: 3,
        subMaxLevel: 2,
        el: "#app",
        themeable: {
          readyTransition: true,
          responsiveTables: true
        },
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: 'Search class content...',
          noData: 'No Results!',
          depth: 4,
          hideOtherSidebarContent: false,
          namespace: 'REPO_NAME',
        },
        copyCode: {
          buttonText: '📋 Click to Copy',
          errorText: '',
          successText: '✓'
        },
        'flexible-alerts': {
          style: 'flat'
        },
        tabs: {
          persist: true,
          sync: true,
          theme: 'classic',
          tabComments: true,
          tabHeadings: true
        },
        pagination: {
          previousText: 'Previous Module',
          nextText: 'Next Module',
          crossChapter: true,
          crossChapterText: true
        },
        // 600s matches GitHub Pages cache-control for markdown.
        requestHeaders: {
          'cache-control': 'max-age=600'
        },
        plugins: [
          function (hook) {
            hook.ready(function () {
              var root = document.querySelector('.search') || document.body
              var strip = function () {
                document.querySelectorAll('.matching-post p').forEach(function (p) {
                  var text = p.textContent.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()
                  if (p.textContent !== text) p.textContent = text
                })
              }
              new MutationObserver(strip).observe(root, { childList: true, subtree: true })
            })
          }
        ],
        gifcontrol: {
          mode: 'hover',
          loadingWidth: '300px',
          loadingHeight: '200px',
          overlayColor: 'rgba(255, 255, 255, 0.7)',
          iconColor: 'rgba(45, 140, 240, 0.8)',
          playIcon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm115.7 272l-176 101c-15.8 8.8-35.7-2.5-35.7-21V152c0-18.4 19.8-29.8 35.7-21l176 107c16.4 9.2 16.4 32.9 0 42z"/></svg>',
          errorIcon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M569.517 440.013C587.975 472.007 564.806 512 527.94 512H48.054c-36.937 0-59.999-40.055-41.577-71.987L246.423 23.985c18.467-32.009 64.72-31.951 83.154 0l239.94 416.028zM288 354c-25.405 0-46 20.595-46 46s20.595 46 46 46 46-20.595 46-46-20.595-46-46-46zm-43.673-165.346l7.418 136c.347 6.364 5.609 11.346 11.982 11.346h48.546c6.373 0 11.635-4.982 11.982-11.346l7.418-136c.375-6.874-5.098-12.654-11.982-12.654h-63.383c-6.884 0-12.356 5.78-11.981 12.654z"/></svg>',
          errorText: "Error loading image",
          errorTextColor: "rgb(150, 150, 150)",
          spinnerBarColor: 'rgb(45, 140, 240)',
          spinnerTrackColor: 'rgba(45, 140, 240, .3)',
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/external-script.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1.6.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1.3.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-gifcontrol@0.2.1/dist/docsify-gifcontrol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
    <!-- Starter Prism languages. Add course-specific packs as needed. -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
    <script>
      if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('Web/sw.js')
      }
    </script>
  </body>
</html>
